<script>
  // Before the first paint: the saved theme (so the intro and the app don't
  // flash dark first) and whether to skip the intro: deep links (#modulo)
  // and reloads within the same session go straight in. See js/splash.js.
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('elg-theme');
      if (t === 'light' || t === 'dark') d.dataset.theme = t;
      else if (window.matchMedia('(prefers-color-scheme: light)').matches) d.dataset.theme = 'light';
    } catch (e) {}
    try { if (sessionStorage.getItem('elg-splash')) d.classList.add('no-splash'); } catch (e) {}

    if (h && h !== 'home') d.classList.add('no-splash');

</script>
