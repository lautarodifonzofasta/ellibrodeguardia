<!DOCTYPE html>

<meta charset="UTF-8">

     ═══════════════════════════════════════ -->

<meta name="author" content="Di Fonzo Lautaro">
<meta name="copyright" content="© 2026 Di Fonzo Lautaro. Todos los derechos reservados.">
<meta name="description" content="El Libro de Guardia — Guía clínica de manejo rápido para residentes. Creado por Di Fonzo Lautaro.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="El Libro de Guardia">
<meta property="og:description" content="Guía clínica offline para guardia médica. © 2026 Di Fonzo Lautaro">
<meta property="og:site_name" content="El Libro de Guardia">
<meta name="creation-date" content="2026">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Libro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#181c24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f4fa" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>El Libro de Guardia</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="copyright-notice">© 2026 Di Fonzo Lautaro · El Libro de Guardia · Todos los derechos reservados</div>

<!-- FAB SCROLL TOP -->
<button id="fab-top" data-i18n-title="app.scrollTopTitle">↑</button>

<!-- SEARCH MODAL -->
<div id="search-modal">
  <div class="s-backdrop"></div>
  <div class="s-box">
    <div class="s-inp-row">
      <span style="font-size:18px;color:var(--text3)">🔍</span>
      <input id="s-inp" type="text" data-i18n-placeholder="app.searchPlaceholder" autocomplete="off">
      <span class="s-esc">ESC</span>
    </div>
    <div class="s-results" id="s-results"></div>
  </div>
</div>

<!-- SIDEBAR OVERLAY -->
<div id="sb-overlay"></div>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sb-logo">
    <img src="icons/logo.png" style="width:40px;height:40px;object-fit:contain;border-radius:8px" alt="">
    <div>
      <div class="sb-logo-name"><span style="color:var(--text)">El Libro </span><span style="color:#E63030">de Guardia</span></div>
      <div class="sb-logo-sub">Para Residentes · Di Fonzo L.</div>
    </div>
    <div class="lang-switch" id="lang-switch">
      <div class="sb-theme-btn" id="lang-btn" data-i18n-title="app.langToggleTitle" aria-haspopup="true" aria-expanded="false"></div>
      <div class="lang-menu" id="lang-menu" hidden></div>
    </div>
    <div class="sb-theme-btn" id="theme-btn" data-i18n-title="app.themeToggleTitle" style="margin-left:6px">🌙</div>
  </div>

  <div class="sb-search">
    <input class="sb-search-inp" id="sb-filter-inp" type="text" data-i18n-placeholder="app.sidebarFilterPlaceholder">
  </div>

  <div class="sb-scroll" id="sb-scroll">
    <!-- Populated at boot from content/meta.json by js/sidebar.js -->
  </div>
</nav>

<!-- MAIN SHELL -->
<div id="shell">
  <div id="topbar">
    <button class="tb-ham" id="ham-btn">☰</button>
    <div class="tb-breadcrumb">
      <span class="tb-bc-root" id="bc-root" style="display:flex;align-items:center;gap:8px">
        <img src="icons/logo.png" style="width:24px;height:24px;object-fit:contain;border-radius:4px" alt="">
        <span style="color:var(--text)">El Libro </span><span style="color:#E63030">de Guardia</span>
      </span>
      <span class="tb-bc-sep" id="bc-sep" style="display:none">/</span>
      <span class="tb-bc-cur" id="bc-cur"></span>
    </div>
    <div class="tb-right">
      <button id="btn-install" data-i18n="app.installLabel" data-i18n-title="app.installTitle">⬇ Instalar</button>
      <button class="tb-search-btn" id="tb-search-btn" data-i18n-title="app.searchButtonTitle" data-i18n-aria-label="app.searchButtonAriaLabel" aria-label="Buscar">🔍</button>
      <span class="tb-kbd" id="tb-kbd-hint" style="cursor:pointer;display:none">⌘K</span>
    </div>
  </div>
  <div id="screen"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
