<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">

<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<body>
<div id="copyright-notice">© 2026 Di Fonzo Lautaro · El Libro de Guardia · Todos los derechos reservados</div>

<!-- FAB SCROLL TOP -->
<button id="fab-top" title="Volver arriba">↑</button>

<!-- SEARCH MODAL -->
<div id="search-modal">
  <div class="s-backdrop"></div>
  <div class="s-box">
    <div class="s-inp-row">
      <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="s-inp" type="text" placeholder="Buscar patología, síntoma, fármaco..." autocomplete="off">
      <span class="s-esc">ESC</span>
    </div>
    <div class="s-results" id="s-results"></div>
  </div>
</div>

<!-- SIDEBAR OVERLAY -->
<div id="sb-overlay"></div>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sb-logo">
    <img class="sb-logo-img" src="icons/logo.png" alt="">
    <div>
      <div class="sb-logo-name"><span>El Libro </span><span class="brand-acc">de Guardia</span></div>
      <div class="sb-logo-sub">Asistente de guardia</div>
      <div class="sb-logo-author">Di Fonzo L.</div>
    </div>
    <div class="sb-theme-btn" id="theme-btn" title="Cambiar tema">🌙</div>
  </div>

  <div class="sb-search">
    <input class="sb-search-inp" id="sb-filter-inp" type="text" placeholder="🔍  Buscar módulo...">
  </div>

  <div class="sb-scroll" id="sb-scroll">
    <!-- Populated at boot from content/meta.json by js/sidebar.js -->
  </div>
</nav>

<!-- MAIN SHELL -->
<div id="shell">
  <div id="topbar">
    <button class="tb-ham" id="ham-btn" type="button" aria-label="Abrir menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M10 16h9"/></svg></button>
    <div class="tb-breadcrumb">
      <span class="tb-bc-root" id="bc-root">
        <img class="tb-logo" src="icons/logo.png" alt="">
        <span class="tb-brand"><span>El Libro </span><span class="brand-acc">de Guardia</span></span>
      </span>
      <span class="tb-bc-sep" id="bc-sep" style="display:none">/</span>
      <span class="tb-bc-cur" id="bc-cur"></span>
    </div>
    <div class="tb-right">
      <button id="btn-install" title="Instalar como app">⬇ Instalar</button>
      <button class="tb-search-btn" id="tb-search-btn" type="button" title="Buscar (Ctrl+K)" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <span class="tb-kbd" id="tb-kbd-hint" style="cursor:pointer;display:none">⌘K</span>
    </div>
  </div>
  <div id="screen"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
